<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Link Building for Startups">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#052e1c"/><stop offset=".55" stop-color="#3d8228"/><stop offset="1" stop-color="#63ac4a"/></linearGradient>
    <radialGradient id="glow" cx=".8" cy=".35" r=".45"><stop offset="0" stop-color="#cdeac1" stop-opacity=".4"/><stop offset="1" stop-color="#cdeac1" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#fff" fill-opacity=".1"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#dots)"/><rect width="1600" height="900" fill="url(#glow)"/>
  <g transform="translate(1350 290) scale(.75) rotate(-35)" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round">
    <rect x="-230" y="-70" width="250" height="140" rx="70" stroke-opacity=".95"/>
    <rect x="-20" y="-70" width="250" height="140" rx="70" stroke-opacity=".55"/>
  </g>
  <g font-family="Helvetica Neue, Arial, sans-serif" fill="#fff">
    <rect x="110" y="120" width="290" height="56" rx="28" fill="#fff" fill-opacity=".14"/>
    <text x="255" y="158" text-anchor="middle" font-size="28" font-weight="700" letter-spacing="4">LINK BUILDING</text>
    <text x="110" y="420" font-size="124" font-weight="800" letter-spacing="-4">Link Building</text>
    <text x="110" y="550" font-size="124" font-weight="800" letter-spacing="-4">for Startups</text>
    <text x="114" y="650" font-size="44" font-weight="500" fill-opacity=".8">Quality backlinks on a budget</text>
  </g>
</svg>
