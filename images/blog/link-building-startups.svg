<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Link Building for Startups">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f9ef"/><stop offset="1" stop-color="#dbeed2"/></linearGradient>
    <radialGradient id="glow" cx=".82" cy=".25" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#3d8228" fill-opacity=".13"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#dots)"/><rect width="1600" height="900" fill="url(#glow)"/>
  <g transform="translate(1350 290) scale(.75) rotate(-35)" fill="none" stroke="#3d8228" stroke-width="30" stroke-linecap="round">
    <rect x="-230" y="-70" width="250" height="140" rx="70" stroke-opacity=".9"/>
    <rect x="-20" y="-70" width="250" height="140" rx="70" stroke-opacity=".45"/>
  </g>
  <g font-family="Helvetica Neue, Arial, sans-serif" fill="#111827">
    <rect x="110" y="120" width="290" height="56" rx="28" fill="#3d8228" fill-opacity=".12"/>
    <text x="255" y="158" text-anchor="middle" font-size="28" font-weight="700" letter-spacing="4" fill="#3d8228">LINK BUILDING</text>
    <text x="110" y="420" font-size="124" font-weight="800" letter-spacing="-4">Link Building</text>
    <text x="110" y="550" font-size="124" font-weight="800" letter-spacing="-4" fill="#3d8228">for Startups</text>
    <text x="114" y="650" font-size="44" font-weight="500" fill="#4b5563">Quality backlinks on a budget</text>
  </g>
</svg>
